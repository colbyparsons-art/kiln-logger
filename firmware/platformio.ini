; Kiln logger firmware (ESP32-DevKitC-32E + MAX31856)
;
; Two builds:
;   kiln – reads the real MAX31856 thermocouple board
;   fake – no sensor needed; plays back a simulated firing (for testing WiFi and uploads on the bench)
;
; In VS Code with the PlatformIO extension: pick the environment in the status bar, then Upload and Monitor.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MAX31856 library@^1.2.7

[env:kiln]

[env:fake]
build_flags = -DUSE_FAKE_SENSOR
